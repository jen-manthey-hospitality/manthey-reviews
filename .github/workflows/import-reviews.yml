name: Import Nashville Reviews from CSV

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download CSV from releases
        run: |
          # For now, we'll use the CSV that should be committed to the repo
          if [ -f "NRB-Reviews.csv" ]; then
            echo "CSV file found locally"
          else
            echo "CSV file should be added to the repo"
          fi

      - name: Run CSV import
        env:
          SUPABASE_URL: https://ofgicptdoygttkyndrnb.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node import-from-csv.js

      - name: Import complete
        run: echo "✓ All Nashville reviews imported to Supabase"
